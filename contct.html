<style>
/* About & Contact Common */

body{
    background:#f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    margin:0;
    padding:0;
}


/* Top Header Table */

table{
    width:90%;
    margin:20px auto;
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}


h2{
    color:#1e4ede;
}


h4 a,
td a{
    text-decoration:none;
    color:#1e4ede;
    font-weight:bold;
}


td a:hover{
    color:red;
}


/* About Paragraph */

p{
    width:80%;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    font-size:18px;
    line-height:1.7;
    color:#444;
}


/* Contact Links */

body a{
    font-size:18px;
}


td a[href^="mailto"],
td a[href^="tel"],
td a[href*="instagram"]{

    display:inline-block;
    background:#1e4ede;
    color:white;
    padding:12px 25px;
    border-radius:8px;
    margin:8px;
}


td a[href^="mailto"]:hover,
td a[href^="tel"]:hover,
td a[href*="instagram"]:hover{

    background:#183eca;
}


/* Mobile */

@media(max-width:700px){

    table{
        width:95%;
    }

    p{
        width:90%;
        font-size:16px;
    }

}

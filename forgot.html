<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="auth-page">
<a href="login.html" class="home-link">Back</a>
<div class="auth-card">
  <h2>Forgot Password</h2>
  <p class="muted">Enter your registered email. Firebase will send a password reset link.</p>
  <form id="forgotForm">
    <label>Email</label>
    <input id="email" type="email" placeholder="Enter Gmail" required>
    <button class="primary-btn" type="submit">Send Reset Link</button>
  </form>
  <p id="message" class="message"></p>
</div>
<script type="module" src="auth.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js")
      .then(function () { console.log("PWA Service Worker registered"); })
      .catch(function (error) { console.error("PWA registration failed:", error); });
  });
}
</script>
</body>
</html>

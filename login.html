<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Assignment Management</title>
<link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="auth-page">
<a href="index.html" class="home-link">Home</a>
<div class="auth-card">
  <h2>Login</h2>
  <p class="muted">Sign in to view assignments</p>
  <form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" placeholder="Enter Gmail" required>
    <label>Password</label>
    <input id="password" type="password" placeholder="Password" required>
    <button class="primary-btn" type="submit">Login</button>
  </form>
    <!--<button id="googleBtn" class="google-btn" type="button">Continue with Google</button> -->
  <a class="auth-link" href="forgot.html">Forgot password?</a>
  <p id="message" class="message"></p>
  <p>Don't have an account? <a href="register.html">Register here</a></p>
</div>
<script type="module" src="auth.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js")
      .then(function () { console.log("PWA Service Worker registered"); })
      .catch(function (error) { console.error("PWA registration failed:", error); });
  });
}
</script>
</body>
</html>

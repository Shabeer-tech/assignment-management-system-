<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Assignment Management</title>
<link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="auth-page">
<a href="index.html" class="home-link">Home</a>
<div class="auth-card">
  <h2>Register</h2>
  <p class="muted">Create a student account</p>
  <form id="registerForm">
    <label>Full Name</label>
    <input id="name" type="text" placeholder="Enter your name" required>
    <label>Email</label>
    <input id="email" type="email" placeholder="Enter Gmail" required>
    <label>Password</label>
    <input id="password" type="password" minlength="6" placeholder="Minimum 6 characters" required>
    <label>Confirm Password</label>
    <input id="confirmPassword" type="password" minlength="6" placeholder="Confirm password" required>
    <button class="primary-btn" type="submit">Create Account</button>
  </form>
  <!--<button id="googleBtn" class="google-btn" type="button">Register with Google</button>-->
  <p id="message" class="message"></p>
  <p>Already have an account? <a href="login.html">Login</a></p>
</div>
<script type="module" src="auth.js"></script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./service-worker.js")
      .then(function () { console.log("PWA Service Worker registered"); })
      .catch(function (error) { console.error("PWA registration failed:", error); });
  });
}
</script>
</body>
</html>
